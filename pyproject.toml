[project]
name = "iris-geohazard"
version = "0.1.0"
description = "IRIS TASK 090: Hesse mining, cavity and contaminated-land restriction harvester (HLNUG) into PostGIS staging"
requires-python = ">=3.15"

[tool.setuptools.packages.find]
include = ["geohazard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires a reachable PostGIS database"]

[tool.ruff]
required-version = "==0.16.7"
target-version = "py315"
line-length = 88
extend-exclude = ["visualize/output", "visualize/data"]
